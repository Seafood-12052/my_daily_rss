name: 每日阅读
on:
  workflow_dispatch:
  schedule:
    # UTC 时间，分别对应北京时间 05:00、10:00、15:00、20:00。
    - cron: '0 21 * * *'
    - cron: '0 2 * * *'
    - cron: '0 7 * * *'
    - cron: '0 12 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-feed
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    environment: TRANSLATION_API_KEY
    steps:
      - uses: actions/checkout@v4
        with:
          # 排队及重跑时读取最新状态，避免从旧提交再次生成同一时段。
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 生成 RSS
        run: python generate.py
        env:
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
          FEED_SITE_URL: ${{ vars.FEED_SITE_URL }}
          READING_SCHEDULE: ${{ github.event.schedule }}
      - name: 保存去重与抽签状态
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update reading state"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
